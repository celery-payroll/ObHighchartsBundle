name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.composer-flags && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '5.4' }
          - { php: '8.1', symfony: '6.4' }
          - { php: '8.1', symfony: '5.4', composer-flags: '--prefer-lowest --prefer-stable' }
          - { php: '8.2', symfony: '7.4' }
          - { php: '8.4', symfony: '5.4' }
          - { php: '8.4', symfony: '6.4' }
          - { php: '8.4', symfony: '7.4' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict --no-check-lock

      - name: Install dependencies pinned to Symfony ${{ matrix.symfony }}
        env:
          SF: ${{ matrix.symfony }}
        run: |
          composer update --prefer-dist --no-progress --no-interaction ${{ matrix.composer-flags }} \
            --with "symfony/http-kernel:${SF}.*" \
            --with "symfony/dependency-injection:${SF}.*" \
            --with "symfony/config:${SF}.*" \
            --with "symfony/yaml:${SF}.*" \
            --with "symfony/framework-bundle:${SF}.*" \
            --with "symfony/twig-bundle:${SF}.*"

      - run: vendor/bin/simple-phpunit
